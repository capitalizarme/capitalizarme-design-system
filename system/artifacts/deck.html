<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capitalizarme — Pitch deck artifact (cover)</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  body { margin: 0; background: var(--color-brand-navy); }
  .cover {
    aspect-ratio: 16 / 9; width: 100%; max-width: 1040px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px; color: #ffffff;
  }
  .cover img.logo { width: 200px; height: auto; }
  .cover h1 {
    font-family: var(--font-display); font-weight: var(--weight-extrabold);
    font-size: 56px; line-height: 1.1; max-width: 14ch; margin: 0;
  }
  .cover .kicker { font-family: var(--font-accent); font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
  .cover .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
  <div class="cover">
    <img class="logo" src="../../assets/logo/horizontal/070726_logo-capitalizarme-blanco-sin-com.png" alt="Capitalizarme" />
    <div>
      <div class="kicker">Presentación</div>
      <h1>Conviértete en inversionista</h1>
    </div>
    <div class="foot">
      <span>Capitalizarme</span>
      <span>capitalizarme.com</span>
    </div>
  </div>
</body>
</html>
